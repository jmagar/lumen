name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    if: github.actor != 'release-please[bot]'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-go-cgo
          max-size: 500M

      - name: Test
        run: |
          # Use ccache to speed up repeated CGO (C) compilation of sqlite3/tree-sitter.
          export CC="ccache gcc"
          export CXX="ccache g++"
          # Print a heartbeat every 60 s so GitHub Actions does not kill the
          # runner during the silent CGO (sqlite3) compilation phase.
          (while true; do echo "[ci] tests still running…"; sleep 60; done) &
          HEARTBEAT=$!
          trap "kill $HEARTBEAT 2>/dev/null || true" EXIT
          CGO_ENABLED=1 go test -p 1 -tags=fts5 -timeout=30m \
            -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.out
          format: golang

      - name: Script tests
        run: bash scripts/test_run.sh

      - name: Vet
        run: go vet -tags=fts5 ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: github.actor != 'release-please[bot]'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --build-tags=fts5

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    if: github.actor != 'release-please[bot]'
    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Wait for Ollama
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/ && break
            sleep 1
          done

      - name: Pull embedding model
        run:
          'curl -sf http://localhost:11434/api/pull -d ''{"name":"all-minilm"}'''

      - name: E2E tests
        run: make e2e
        env:
          OLLAMA_HOST: http://localhost:11434
          LUMEN_EMBED_MODEL: all-minilm
          LUMEN_EMBED_DIMS: '384'

      - name: E2E lang tests
        run: make e2e-lang
        env:
          OLLAMA_HOST: http://localhost:11434
          LUMEN_EMBED_MODEL: all-minilm
          LUMEN_EMBED_DIMS: '384'

  download:
    name: Download (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.actor != 'release-please[bot]'
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # Happy path: set manifest to real latest release, download, verify
      - name: Get latest release tag
        id: latest
        run: |
          TAG=$(curl -sfL -H "Authorization: token $GITHUB_TOKEN" \
            https://api.github.com/repos/ory/lumen/releases/latest \
            | sed -n 's/.*"tag_name"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Set manifest to latest release
        run: printf '{\n  ".": "%s"\n}\n' "${{ steps.latest.outputs.version }}" > .release-please-manifest.json
        shell: bash

      - name: Download via run script (happy path)
        id: happy_unix
        run: |
          OUTPUT=$(scripts/run.sh version)
          echo "version=$OUTPUT" >> "$GITHUB_OUTPUT"
        shell: bash
        if: runner.os != 'Windows'

      - name: Download via run.bat (happy path)
        id: happy_win
        run: |
          for /f "delims=" %%i in ('scripts\run.bat version') do set "VER=%%i"
          echo version=%VER%>> %GITHUB_OUTPUT%
        shell: cmd
        if: runner.os == 'Windows'

      - name: Verify version output (happy path)
        run: |
          VER="${{ steps.happy_unix.outputs.version }}${{ steps.happy_win.outputs.version }}"
          echo "Binary reported version: $VER"
          echo "$VER" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]' \
            || { echo "ERROR: version output does not match semver pattern"; exit 1; }
        shell: bash

      # Fallback path: set manifest to nonexistent version, verify fallback
      - name: Clear downloaded binary
        run: rm -rf bin/
        shell: bash

      - name: Set manifest to nonexistent version
        run: printf '{\n  ".": "99.99.99"\n}\n' > .release-please-manifest.json
        shell: bash

      - name: Download via run script (fallback path)
        id: fallback_unix
        run: |
          OUTPUT=$(scripts/run.sh version)
          echo "version=$OUTPUT" >> "$GITHUB_OUTPUT"
        shell: bash
        if: runner.os != 'Windows'

      - name: Download via run.bat (fallback path)
        id: fallback_win
        run: |
          for /f "delims=" %%i in ('scripts\run.bat version') do set "VER=%%i"
          echo version=%VER%>> %GITHUB_OUTPUT%
        shell: cmd
        if: runner.os == 'Windows'

      - name: Verify version output (fallback path)
        run: |
          VER="${{ steps.fallback_unix.outputs.version }}${{ steps.fallback_win.outputs.version }}"
          echo "Fallback binary reported version: $VER"
          echo "$VER" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]' \
            || { echo "ERROR: version output does not match semver pattern"; exit 1; }
        shell: bash
